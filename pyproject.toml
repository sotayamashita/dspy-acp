[project]
name = "dspy-acp"
version = "0.1.0"
description = "DSPy adapter for ACP (Agent Client Protocol) agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["dspy", "acp", "llm", "agent", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "dspy>=2.5.0",
    "agent-client-protocol>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/sotayamashita/dspy-acp"
Repository = "https://github.com/sotayamashita/dspy-acp"
Issues = "https://github.com/sotayamashita/dspy-acp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dspy_acp"]

[tool.uv]
dev-dependencies = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
